# DFTB Trajectory Analysis Settings
# Standard (non-constrained) DFTB calculations along a trajectory.
# Computes energies for closed-shell systems.

# Input paths (relative to this config file directory)
input:
  trajectory: "traj/test2.dcd"         # Trajectory file (DCD format)
  topology: "traj/pentacene.pdb"      # Topology file (GRO/PDB/etc.)
  qm_atoms: "traj/qmatoms"            # QM atom indices file (0-indexed)
  pccharges_template: "input/PCcharges.dat"    # Point charges template
  hsd_template: "input/dftb_in.hsd"            # DFTB+ HSD template

# Output settings
output:
  directory: "output_dftb2"            # Output directory
  energy_file: "energies.dat"         # Energy output file
  work_directory: "work"              # Working directory name

# Frame selection
frames:
  start: 0                            # First frame to process (0-indexed)
  n_frames: null                        # Number of frames (null = all)
  t0_fs: 100.0                          # Initial time (fs)
  dt_fs: 4.0                          # Time step (fs) between frames

# DFTB+ settings
dftb:
  library_path: "/home/takahashi/opt/dftb+/lib/libdftbplus.so"
  num_threads: 4                      # Number of CPU threads (null = use system default)
  timeout: 600                        # Timeout per calculation (seconds)

# SCC settings
scc:
  # Use charges from previous frame as initial guess for faster convergence
  use_previous_charges: false

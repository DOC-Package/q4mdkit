# MM Settings Configuration File
# Pure force field MD simulation settings

# File paths
paths:
  amber_prmtop: "../input/nile-red_acetone.prmtop"
  pdbfile: "../opt-mm/frag-minimized.pdb"
  boxfile: "../input/nile-red_acetone.box"

# Parallel settings
parallel:
  numcores: 4

# OpenMM settings
openmm:
  periodic: true
  periodic_nonbonded_cutoff: 9.0
  use_boxfile: true
  autoconstraints: HBonds
  hydrogenmass: 1.0
  platform: "CPU"

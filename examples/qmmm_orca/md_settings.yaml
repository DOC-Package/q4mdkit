# MD Settings Configuration File for ORCA QM/MM

# MD parameters
md:
  # Timestep should be small for ab initio QM/MM
  timestep: 0.0005         # ps (0.5 fs, conservative for ORCA)
  traj_frequency: 100      # Save every 100 steps (50 fs)
  special_wrapping: false  # Enable ASH mdtraj wrapping for problematic PBC cases
  special_wrapping_updatepos: false  # Update OpenMM positions after wrapping
  wrapping_atoms: null     # Optional anchor atom indices used by ASH wrapping
  integrator:
    nvt: "LangevinMiddleIntegrator"
    npt: "LangevinMiddleIntegrator"
    nve: "VelocityVerletIntegrator"
  nvt:
    temperature: 300.0       # K
    coupling_frequency: 1    # 1/ps
  npt:
    barostat: "MonteCarloBarostat"
    pressure: 1              # bar
    barostat_frequency: 25   # steps
  simulation_time:
    nvt: 1.0               # ps (short for testing)
    npt: 1.0               # ps
    nve: 1.0               # ps

# Output settings
output:
  directory: "output"

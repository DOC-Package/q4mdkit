# QM/MM Settings Configuration File

# File paths
paths:
  sk_dir: "/home/borrelli/qmmm/sk/3ob"
  amber_prmtop: "/scratch/qmmm/ph-btbt-c10/input/ph-btbt-c10.prmtop"
  pdbfile: "/scratch/qmmm/ph-btbt-c10/input/ph-btbt-c10.pdb"
  qatoms: "/scratch/qmmm/ph-btbt-c10/input/qmatoms"
  boxfile: "/scratch/qmmm/ph-btbt-c10/input/ph-btbt-c10.box"
# Parallel settings
parallel:
  numcores_qm: 4
  numcores_mm: 4

# QM region settings
qm:
  charge: 0
  mult: 1

# DFTB parameters
dftb:
  slater_koster_files:
    C-C: "{sk_dir}/C-C.skf"
    C-H: "{sk_dir}/C-H.skf"
    H-C: "{sk_dir}/H-C.skf"
    H-H: "{sk_dir}/H-H.skf"
    S-S: "{sk_dir}/S-S.skf"
    S-C: "{sk_dir}/S-C.skf"
    C-S: "{sk_dir}/C-S.skf"
    S-H: "{sk_dir}/S-H.skf"
    H-S: "{sk_dir}/H-S.skf"
  third_order_full: true   
  hubbard_derivs:
    H: -0.1857
    C: -0.1492
    S: -0.11

  hcorrection_zeta: 4.0
  max_scc_iterations: 300  
  scc_log: true   
  energy_log: true        

# OpenMM settings
openmm:
  periodic: true
  periodic_nonbonded_cutoff: 9.0
  use_boxfile: true
  autoconstraints: HBonds
  hydrogenmass: 1.0
  platform: "CPU"

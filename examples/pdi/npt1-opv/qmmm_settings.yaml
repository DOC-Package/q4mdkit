# QM/MM Settings Configuration File (DFTB / OPV-B3LYP)

# File paths
paths:
  sk_dir: "/home/takahashi/qmmm/sk/opv/b3lyp"
  amber_prmtop: "../input/pdi_acetonitrile.prmtop"
  pdbfile: "../input/pdi_acetonitrile.pdb"
  qatoms: "../input/qmatoms"
  boxfile: "../input/pdi_acetonitrile.box"

# Parallel settings
parallel:
  numcores_qm: 4
  numcores_mm: 4

# QM region settings
qm:
  charge: 0
  mult: 1

# DFTB parameters (CAM-hybrid DFTB with OPV-B3LYP SKF)
dftb:
  slater_koster_files:
    C-C: "{sk_dir}/C-C.skf"
    C-H: "{sk_dir}/C-H.skf"
    H-C: "{sk_dir}/H-C.skf"
    H-H: "{sk_dir}/H-H.skf"
    C-N: "{sk_dir}/C-N.skf"
    N-C: "{sk_dir}/N-C.skf"
    N-N: "{sk_dir}/N-N.skf"
    N-H: "{sk_dir}/N-H.skf"
    H-N: "{sk_dir}/H-N.skf"
    C-O: "{sk_dir}/C-O.skf"
    O-C: "{sk_dir}/O-C.skf"
    O-O: "{sk_dir}/O-O.skf"
    N-O: "{sk_dir}/N-O.skf"
    O-N: "{sk_dir}/O-N.skf"
    H-O: "{sk_dir}/H-O.skf"
    O-H: "{sk_dir}/O-H.skf"

  third_order_full: false

  max_scc_iterations: 300

  #mixer:
  #  method: Broyden          # Broyden / Anderson / Simple / DIIS
  #  params:
  #    MixingParameter: 0.2
  
  #filling:
  #  method: Fermi
  #  params:
  #    "Temperature [K]": 1000 

  #read_initial_charges: false

  scc_log: true
  energy_log: true

  # Hybrid ブロックを有効化
  # DFTB+ では以下を指定可能:
  #   method: Global | LC | CAM
  #   params.Screening: Thresholded | NeighbourBased | MatrixBased
  #   params.CoulombMatrix: Truncated | TruncatedAndDamped | MinimumImage | Full
  # Hybrid の α, β, ω (Yukawa 型の range separation) は入力ではなく
  # SK ファイル側のパラメータから読まれる。
  # OPV-B3LYP の SKF には
  #   RangeSep
  #   CAM  0.0  0.2  0.0
  # とあり、CAM 形式で与えられている。
  # これは実質的には B3LYP 型の global hybrid 相当だが、
  # DFTB+ 入力では SK に合わせて method: CAM としておく。
  hybrid:
    method: CAM              # SKF の RangeSep 指定に合わせる
    params:
      Screening:
        method: MatrixBased  # 推奨: 非周期/周期とも高速
      # Thresholded の例（非周期のみ。restart / spin / MPI に制限あり）
      # Screening:
      #   method: Thresholded
      #   params:
      #     Threshold: 1.0e-6
      #     "CutoffReduction [Bohr]": 0.0
      # NeighbourBased の例（periodic や restart に対応）
      # Screening:
      #   method: NeighbourBased
      #   params:
      #     Threshold: 1.0e-6
      #     "CutoffReduction [Bohr]": 0.0
      # periodic 計算で CoulombMatrix を明示したい場合の例
      # CoulombMatrix:
      #   method: Truncated
      #   params:
      #     "CoulombCutoff [Bohr]": 20.0
      #     "GSummationCutoff [Bohr]": 20.0
      # CAM の場合は method: CAM にするだけでよく、α/β/ω は SK 依存

  dispersion: "DFTD3"
  dispersion_params:
    Damping:
      type: "BeckeJohnson"
      a1: 0.497
      a2: 3.622
    s6: 1.0
    s8: 0.010

# OpenMM settings
openmm:
  periodic: true
  periodic_nonbonded_cutoff: 9.0
  use_boxfile: true
  autoconstraints: HBonds
  hydrogenmass: 1.0
  platform: "CPU"

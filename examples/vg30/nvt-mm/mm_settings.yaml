# MM Settings Configuration File
# Pure force field MD simulation settings

# File paths
paths:
  amber_prmtop: "../input/vg30_acetonitrile.prmtop"
  pdbfile: "../opt-mm/frag-minimized.pdb"
  boxfile: "../input/vg30_acetonitrile.box"

# Parallel settings
parallel:
  numcores: 4

# OpenMM settings
openmm:
  periodic: true
  periodic_nonbonded_cutoff: 9.0
  use_boxfile: true
  autoconstraints: HBonds
  hydrogenmass: 1.0
  platform: "CPU"

# System-specific checks used by the generic library validator.
validation:
  expected_atoms: 5597
  residue_blocks:
    - name: VG3
      count: 77
    - name: ACE
      count: 5520

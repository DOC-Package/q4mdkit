# QM/MM Settings Configuration File (DFTB / OPV-B3LYP)

# File paths
paths:
  sk_dir: "/home/takahashi/qmmm/sk/opv/b3lyp"
  amber_prmtop: "../input/vg30_acetonitrile.prmtop"
  pdbfile: "../npt-mm/output/npt_lastframe.pdb"
  qatoms: "../input/qmatoms"
  boxfile: "../npt-mm/output/npt_lastframe.box"

# Parallel settings
parallel:
  numcores_qm: 4
  numcores_mm: 4

# QM region: cationic VG30 ground state
qm_backend: dftb
qm:
  charge: 1
  mult: 1

# DFTB parameters (OPV-B3LYP Slater-Koster set)
dftb:
  slater_koster_files:
    C-C: "{sk_dir}/C-C.skf"
    C-H: "{sk_dir}/C-H.skf"
    C-N: "{sk_dir}/C-N.skf"
    C-O: "{sk_dir}/C-O.skf"
    C-Cl: "{sk_dir}/C-Cl.skf"
    H-C: "{sk_dir}/H-C.skf"
    H-H: "{sk_dir}/H-H.skf"
    H-N: "{sk_dir}/H-N.skf"
    H-O: "{sk_dir}/H-O.skf"
    H-Cl: "{sk_dir}/H-Cl.skf"
    N-C: "{sk_dir}/N-C.skf"
    N-H: "{sk_dir}/N-H.skf"
    N-N: "{sk_dir}/N-N.skf"
    N-O: "{sk_dir}/N-O.skf"
    N-Cl: "{sk_dir}/N-Cl.skf"
    O-C: "{sk_dir}/O-C.skf"
    O-H: "{sk_dir}/O-H.skf"
    O-N: "{sk_dir}/O-N.skf"
    O-O: "{sk_dir}/O-O.skf"
    O-Cl: "{sk_dir}/O-Cl.skf"
    Cl-C: "{sk_dir}/Cl-C.skf"
    Cl-H: "{sk_dir}/Cl-H.skf"
    Cl-N: "{sk_dir}/Cl-N.skf"
    Cl-O: "{sk_dir}/Cl-O.skf"
    Cl-Cl: "{sk_dir}/Cl-Cl.skf"

  third_order_full: false
  max_scc_iterations: 300
  read_initial_charges: false
  scc_log: true
  energy_log: true

  # OPV-B3LYP SKF stores its B3LYP-like exchange parameters as CAM data.
  hybrid:
    method: CAM
    params:
      Screening:
        method: MatrixBased

  dispersion: "DFTD3"
  dispersion_params:
    Damping:
      type: "BeckeJohnson"
      a1: 0.497
      a2: 3.622
    s6: 1.0
    s8: 0.010

# OpenMM settings
openmm:
  periodic: true
  periodic_nonbonded_cutoff: 9.0
  use_boxfile: true
  autoconstraints: HBonds
  hydrogenmass: 1.0
  platform: "CPU"

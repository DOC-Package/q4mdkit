# QM/MM Settings Configuration File

# File paths
paths:
  sk_dir: "/home/takahashi/qmmm/sk/3ob"
  # AMBER topology files
  amber_prmtop: "/home/takahashi/qmmm/pentacene/pentacene.prmtop"
  amber_inpcrd: "/home/takahashi/qmmm/pentacene/pentacene.inpcrd"
  # QM atom indices file
  qatoms: "/home/takahashi/qmmm/pentacene/qmatoms"
  actatoms: "/home/takahashi/qmmm/pentacene/actatoms"

# Parallel settings
parallel:
  numcores_qm: 4
  numcores_mm: 4

# QM region settings
qm:
  charge: 0
  mult: 1

# QM backend selection: "dftb" or "orca"
qm_backend: "dftb"

# DFTB parameters
dftb:
  library_path: null  # Path to DFTB+ binary directory (e.g., /path/to/dftbplus/bin)
  slater_koster_files:
    C-C: "{sk_dir}/C-C.skf"
    C-H: "{sk_dir}/C-H.skf"
    H-C: "{sk_dir}/H-C.skf"
    H-H: "{sk_dir}/H-H.skf"
  hubbard_derivs:
    H: -0.1857
    C: -0.1492
  hcorrection_zeta: 4.0
  max_scc_iterations: 300  # Maximum SCC iterations for DFTB
  scc_tolerance: 1e-6        # SCC convergence tolerance for DFTB
  third_order_full: true   # Enable DFTB3 third-order correction
  # Dispersion correction
  # Options: DFTD3, DFTD4, SimpleDFTD3, SlaterKirkwood, LennardJones, TS, MBD
  dispersion: null
  # Optional parameters for dispersion
  # Example for DFTD3 with BJ damping (3ob parameters):
  #   Damping:
  #     type: "BeckeJohnson"
  #     a1: 0.746
  #     a2: 4.191
  #   s6: 1.0
  #   s8: 3.209
  dispersion_params: null
  # General DFTB+ Hybrid block (optional).
  # This is passed through to Hamiltonian.DFTB.Hybrid.
  # Example for LC-DFTB with matrix-based screening:
  #   hybrid:
  #     method: LC
  #     params:
  #       Screening:
  #         method: MatrixBased
  hybrid: null
  # SCC mixer settings (optional)
  # method: Broyden | Anderson | Simple | DIIS
  # Example:
  #   mixer:
  #     method: Broyden
  #     params:
  #       MixingParameter: 0.05
  mixer: null
  # Filling / electron smearing (optional)
  # Example:
  #   filling:
  #     method: Fermi
  #     params:
  #       "Temperature [K]": 1000
  filling: null
  # SCC error logging (extract from detailed.out at each MD step)
  scc_log_enabled: false   # Enable SCC convergence logging
  scc_logfile: "scc_error.dat"  # Output file for SCC error log
  keep_detailed: false     # Keep detailed.out for each step (detailed_NNNNNN.out)
  log_energy: false        # Log QM total energy at each step
  energy_logfile: "qm_energy.dat"  # Output file for energy log

# ORCA parameters
orca:
  orcadir: null  # Path to ORCA bin directory (e.g., /home/user/local/orca/bin)
  # ORCA simple input line (method, basis set, etc.)
  # Examples:
  #   DFT: "! B3LYP def2-SVP D3BJ TightSCF"
  #   RI-DFT: "! RI-B3LYP def2-SVP def2/J RIJCOSX D3BJ TightSCF"
  #   HF: "! HF def2-SVP TightSCF"
  orcasimpleinput: "! B3LYP def2-SVP D3BJ TightSCF"
  # ORCA block input for advanced settings
  orcablocks: |
    %scf
      MaxIter 300
    end
  numcores: 4            # Number of cores for ORCA parallel execution
  # Logging settings
  log_enabled: false     # Enable energy logging
  keep_output: false     # Keep ORCA output for each step (orca_NNNNNN.out)
  energy_logfile: "orca_energy.dat"  # Output file for energy log

# OpenMM settings
openmm:
  periodic: true
  periodic_nonbonded_cutoff: 9.0
  autoconstraints: null
  # Optional user-defined bond constraints passed to ASH/OpenMM.
  # Each entry is [atom_i, atom_j, distance_A]. If distance_A is omitted,
  # the current distance from fragment/pdb coordinates is used.
  bondconstraints: null
  rigidwater: false
  hydrogenmass: 1.5
  platform: "CPU"

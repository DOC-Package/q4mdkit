# MD Settings Configuration File

# MD parameters
md:
  timestep: 0.001          # ps (1.0 fs)
  traj_frequency: 50       # steps
  special_wrapping: false  # Let ASH/mdtraj wrap coordinates each step
  special_wrapping_updatepos: false  # Push wrapped coordinates back to OpenMM
  postprocess_wrapped_trajectory: null  # null follows special_wrapping; writes *_wrapped.dcd
  wrap_final_pdb: null  # null follows special_wrapping; rewrites *_lastframe.pdb and keeps *_raw.pdb
  wrap_final_state: null  # null follows special_wrapping; rewrites OpenMM_MD_final_state.xml
  wrapping_atoms: null     # Optional anchor atom indices for wrapping
  wrapping_atoms_file: null  # Optional file containing 0-indexed atom indices
  integrator:
    nvt: "LangevinMiddleIntegrator"
    npt: "LangevinMiddleIntegrator"
    nve: "VelocityVerletIntegrator"
  nvt:
    temperature: 300.0       # K
    coupling_frequency: 1    # 1/ps
  npt:
    barostat: "MonteCarloBarostat"
    pressure: 1              # bar
    barostat_frequency: 25   # steps
  simulation_time:
    nvt: 100.0             # ps
    npt: 100.0             # ps
    nve: 100.0             # ps

# Output settings
output:
  directory: "output"

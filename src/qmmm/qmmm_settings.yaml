# QM/MM Settings Configuration File

# File paths
paths:
  sk_dir: "/home/takahashi/qmmm/sk/3ob"
  # AMBER topology files
  amber_prmtop: "/home/takahashi/qmmm/pentacene/pentacene.prmtop"
  amber_inpcrd: "/home/takahashi/qmmm/pentacene/pentacene.inpcrd"
  # QM atom indices file
  qatoms: "/home/takahashi/qmmm/pentacene/qmatoms"
  actatoms: "/home/takahashi/qmmm/pentacene/actatoms"

# Parallel settings
parallel:
  numcores_qm: 4
  numcores_mm: 4

# QM region settings
qm:
  charge: 0
  mult: 1

# DFTB parameters
dftb:
  slater_koster_files:
    C-C: "{sk_dir}/C-C.skf"
    C-H: "{sk_dir}/C-H.skf"
    H-C: "{sk_dir}/H-C.skf"
    H-H: "{sk_dir}/H-H.skf"
  hubbard_derivs:
    H: -0.1857
    C: -0.1492
  hcorrection_zeta: 4.0
  max_scc_iterations: 300  # Maximum SCC iterations for DFTB
  third_order_full: true   # Enable DFTB3 third-order correction
  # SCC error logging (extract from detailed.out at each MD step)
  scc_log_enabled: false   # Enable SCC convergence logging
  scc_logfile: "scc_error.dat"  # Output file for SCC error log
  keep_detailed: false     # Keep detailed.out for each step (detailed_NNNNNN.out)
  log_energy: false        # Log QM total energy at each step
  energy_logfile: "qm_energy.dat"  # Output file for energy log

# OpenMM settings
openmm:
  periodic: true
  periodic_nonbonded_cutoff: 9.0
  autoconstraints: null
  rigidwater: false
  hydrogenmass: 1.5
  platform: "CPU"

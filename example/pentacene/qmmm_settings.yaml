# QM/MM Settings Configuration File

# File paths
paths:
  sk_dir: "/home/takahashi/qmmm/sk/3ob"
  gromacs_top_dir: "/home/takahashi/python/qm4dcrystal/example/pentacene/input"
  gromacs_top_file: "/home/takahashi/python/qm4dcrystal/example/pentacene/input/pentacene.top"
  grofile: "/home/takahashi/python/qm4dcrystal/example/pentacene/input/pentacene.gro"
  qatoms: "/home/takahashi/python/qm4dcrystal/example/pentacene/input/qmatoms"

# Parallel settings
parallel:
  numcores_qm: 4
  numcores_mm: 4

# QM region settings
qm:
  charge: 0
  mult: 1

# DFTB parameters
dftb:
  slater_koster_files:
    C-C: "{sk_dir}/C-C.skf"
    C-H: "{sk_dir}/C-H.skf"
    H-C: "{sk_dir}/H-C.skf"
    H-H: "{sk_dir}/H-H.skf"
  hubbard_derivs:
    H: -0.1857
    C: -0.1492
  hcorrection_zeta: 4.0

# OpenMM settings
openmm:
  periodic: true
  periodic_nonbonded_cutoff: 9.0
  autoconstraints: null
  rigidwater: false
  hydrogenmass: 1.5
  platform: "CPU"
